<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decibel MM Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1c2330; --muted: #667085; --line: #e3e6ec;
    --good: #0f9d58; --bad: #d93025; --warn: #e8710a; --info: #1a73e8; --accent: #1a73e8;
    --good-bg: #e6f4ea; --bad-bg: #fce8e6; --warn-bg: #fef3e0; --info-bg: #e8f0fe;
    --m0: #1a73e8; --m1: #e8710a; --m2: #0f9d58; --m3: #9334e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --ink: #e8ebf1; --muted: #98a2b3; --line: #2b3240;
      --good: #4cc38a; --bad: #ff6b60; --warn: #ffa94d; --info: #6aa5ff; --accent: #6aa5ff;
      --good-bg: #17332a; --bad-bg: #3a1f1d; --warn-bg: #3a2a15; --info-bg: #182b4a;
      --m0: #6aa5ff; --m1: #ffa94d; --m2: #4cc38a; --m3: #c58af9;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  h3 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
  .spacer { flex: 1; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .b-running { background: var(--good-bg); color: var(--good); }
  .b-stale, .b-halted { background: var(--bad-bg); color: var(--bad); }
  .b-stopped, .b-no-data { background: var(--info-bg); color: var(--info); }
  .b-dry { background: var(--warn-bg); color: var(--warn); }
  .b-live { background: var(--bad-bg); color: var(--bad); }
  .muted { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--muted); }
  .dot.ok { background: var(--good); } .dot.old { background: var(--warn); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-variant-numeric: tabular-nums; }
  .toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 10px; margin: 0 -10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 5px 11px; font: inherit; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  select, input[type=number] { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; }
  input[type=number] { width: 78px; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .alerts { display: grid; gap: 6px; margin-bottom: 12px; }
  .alert { padding: 8px 12px; border-radius: 8px; border-left: 4px solid; }
  .alert.error { background: var(--bad-bg); border-color: var(--bad); }
  .alert.warn { background: var(--warn-bg); border-color: var(--warn); }
  .alert.info { background: var(--info-bg); border-color: var(--info); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-bottom: 12px; }
  .grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
  .grid.mk { grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; overflow-x: auto; }
  .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .bar { position: relative; height: 10px; background: var(--line); border-radius: 6px; margin: 8px 0 4px; overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
  .bar > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--card); }
  td.r, th.r { text-align: right; }
  .scroll { max-height: 340px; overflow: auto; }
  canvas { width: 100%; height: 190px; display: block; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  .tag { padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .t-maker, .t-info { background: var(--good-bg); color: var(--good); }
  .t-taker, .t-error { background: var(--bad-bg); color: var(--bad); }
  .t-warn { background: var(--warn-bg); color: var(--warn); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .detail { color: var(--muted); word-break: break-all; }
  .mk h2 { display: flex; justify-content: space-between; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Decibel MM</h1>
    <span id="state" class="badge b-no-data">…</span>
    <span id="mode" class="badge"></span>
    <span id="meta" class="muted"></span>
    <span class="spacer"></span>
    <span id="aptchip" class="chip" title="Giá APT (đồng gas) theo USD"></span>
    <span id="clock" class="muted"></span>
  </header>

  <div class="toolbar">
    <div class="seg" id="ranges">
      <button data-r="300">5 phút</button>
      <button data-r="900">15 phút</button>
      <button data-r="3600">1 giờ</button>
      <button data-r="21600">6 giờ</button>
      <button data-r="86400">24 giờ</button>
      <button data-r="0">Cả phiên</button>
      <button data-r="custom">Tùy chọn</button>
    </div>
    <span id="customBox" class="hidden"><input id="customMin" type="number" min="1" max="10080" step="1" value="30"> <span class="muted">phút gần nhất</span></span>
    <label class="inline">Thị trường <select id="market"><option value="">Tất cả</option></select></label>
    <label class="inline"><input id="aptAuto" type="checkbox" checked> giá APT tự động</label>
    <span id="aptManualBox" class="hidden"><input id="aptManual" type="number" step="0.01" min="0.01" value="0.8"></span>
    <span class="spacer"></span>
    <span id="livechip" class="muted"></span>
  </div>

  <div id="alerts" class="alerts"></div>

  <div class="grid" id="kpis"></div>
  <div class="grid mk" id="markets"></div>

  <div class="grid wide">
    <div class="card"><h2>Kinh tế (toàn tài khoản · <span class="rangeLabel"></span>)</h2><table id="econ"></table><div id="econNote" class="sub"></div></div>
    <div class="card"><h2>Báo giá đang đặt</h2><div id="quotes"></div></div>
  </div>

  <div class="grid wide">
    <div class="card"><h2>Vốn (USD)</h2><canvas id="c-equity"></canvas></div>
    <div class="card"><h2>Vị thế (USD, dương = mua/long)</h2><canvas id="c-pos"></canvas><div class="legend" id="l-pos"></div></div>
    <div class="card"><h2>Khối lượng khớp tích lũy (USD)</h2><canvas id="c-vol"></canvas><div class="legend" id="l-vol"></div></div>
    <div class="card"><h2>Số dư APT của ví ký</h2><canvas id="c-apt"></canvas></div>
  </div>

  <div class="grid wide">
    <div class="card"><h2 id="h-fills">Lệnh khớp</h2><div class="scroll"><table id="fills"></table></div></div>
    <div class="card"><h2 id="h-txs">Giao dịch đặt lệnh</h2><div class="scroll"><table id="txs"></table></div></div>
  </div>

  <div class="card"><h2 id="h-events">Sự kiện (cảnh báo, lỗi, cầu chì, ramp)</h2><div class="scroll"><table id="events"></table></div></div>

  <footer id="foot"></footer>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = (x) => typeof x === "number" && Number.isFinite(x);
const fmt = (x, d = 2) => (isNum(x) ? x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–");
const sgn = (x, d = 2) => (isNum(x) ? (x > 0 ? "+" : "") + fmt(x, d) : "–");
const cls = (x) => (!isNum(x) || x === 0 ? "" : x > 0 ? "good" : "bad");
const pad2 = (n) => String(n).padStart(2, "0");
function tfmt(ms, spanMs) {
  const d = new Date(ms), hms = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  if (spanMs > 20 * 3600e3) return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)} ${hms.slice(0, 5)}`;
  return spanMs > 2 * 3600e3 ? hms.slice(0, 5) : hms;
}
const hhmmss = (ms) => tfmt(ms, 0);
function dur(sec) {
  if (!isNum(sec)) return "–";
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
  return h ? `${h}g ${m}p` : m ? `${m}p ${s}s` : `${s}s`;
}
const STATE_TXT = { "no-data": "CHƯA CÓ LOG", running: "ĐANG CHẠY", stale: "MẤT TÍN HIỆU", stopped: "ĐÃ DỪNG", halted: "BOT TỰ DỪNG" };
const MCOL = ["--m0", "--m1", "--m2", "--m3"];

// ---- settings (remembered in this browser only) --------------------------------------------
const S = { range: "3600", custom: 30, market: "", aptAuto: true, apt: 0.8 };
try { Object.assign(S, JSON.parse(localStorage.getItem("mm.settings") || "{}")); } catch (e) { /* storage may be blocked */ }
function save() { try { localStorage.setItem("mm.settings", JSON.stringify(S)); } catch (e) { /* ignore */ } }
const rangeSec = () => (S.range === "custom" ? Math.max(1, Math.round(S.custom * 60)) : Number(S.range));
function rangeText() {
  const s = rangeSec();
  if (!s) return "cả phiên";
  return s < 3600 ? `${Math.round(s / 60)} phút qua` : s % 3600 === 0 ? `${s / 3600} giờ qua` : `${Math.round(s / 60)} phút qua`;
}
function syncControls() {
  for (const b of $("ranges").children) b.classList.toggle("on", b.dataset.r === String(S.range));
  $("customBox").classList.toggle("hidden", S.range !== "custom");
  $("customMin").value = S.custom;
  $("aptAuto").checked = S.aptAuto;
  $("aptManualBox").classList.toggle("hidden", S.aptAuto);
  $("aptManual").value = S.apt;
  for (const e of document.querySelectorAll(".rangeLabel")) e.textContent = rangeText();
}
$("ranges").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  S.range = b.dataset.r; save(); syncControls(); refresh();
});
$("customMin").addEventListener("change", () => { S.custom = Math.min(10080, Math.max(1, Number($("customMin").value) || 30)); save(); syncControls(); refresh(); });
$("market").addEventListener("change", () => { S.market = $("market").value; save(); refresh(); });
$("aptAuto").addEventListener("change", () => { S.aptAuto = $("aptAuto").checked; save(); syncControls(); refresh(); });
$("aptManual").addEventListener("change", () => { S.apt = Number($("aptManual").value) || 0.8; save(); refresh(); });

// ---- rendering helpers ---------------------------------------------------------------------
const last = {};
function setHTML(id, html) {
  if (last[id] === html) return; // leave the DOM (and any text selection) alone when nothing changed
  last[id] = html;
  $(id).innerHTML = html;
}
function card(title, big, bigCls, sub) {
  return `<div class="card"><h2>${esc(title)}</h2><div class="big ${bigCls || ""}">${big}</div><div class="sub">${sub || ""}</div></div>`;
}

let lastData = null;
function render(d) {
  lastData = d;
  const r = d.run, L = d.latest || {}, e = d.econ, lim = d.config.limits || {};
  $("state").className = "badge b-" + r.state;
  $("state").textContent = STATE_TXT[r.state] || r.state;
  $("state").title = r.detail;
  $("mode").className = "badge " + (r.dryRun ? "b-dry" : "b-live");
  $("mode").textContent = r.state === "no-data" ? "" : r.dryRun ? "THỬ (không gửi tx)" : "THẬT";
  $("meta").textContent = r.state === "no-data" ? r.detail : `${r.network || ""} · ${(r.markets || []).join(", ")} · chạy ${dur(r.uptimeSec)} · tín hiệu cuối ${dur(r.ageSec)} trước`;
  $("clock").textContent = new Date(d.generatedAt).toLocaleTimeString("vi-VN", { hour12: false });
  $("livechip").innerHTML = r.liveSeen
    ? '<span class="dot ok"></span>trực tiếp · cập nhật mỗi giây'
    : '<span class="dot old"></span>theo log (30 giây/lần) · khởi động lại bot bản mới để có dữ liệu mỗi giây';

  // APT price
  const p = d.aptPrice;
  if (!S.aptAuto) $("aptchip").innerHTML = `<span class="dot"></span>APT $${fmt(S.apt, 4)} <span class="muted">thủ công</span>`;
  else if (p) $("aptchip").innerHTML = `<span class="dot ${p.stale ? "old" : "ok"}"></span>APT $${fmt(p.usd, 4)} <span class="muted">${esc(p.source)} · ${p.ageSec}s</span>`;
  else $("aptchip").innerHTML = `<span class="dot old"></span>APT $${fmt(e.aptUsd, 4)} <span class="muted">không lấy được giá, dùng mặc định</span>`;

  // market filter options
  const sel = $("market"), want = ["", ...(r.markets || [])];
  if (JSON.stringify([...sel.options].map((o) => o.value)) !== JSON.stringify(want)) {
    sel.innerHTML = want.map((m) => `<option value="${esc(m)}">${m ? esc(m) : "Tất cả"}</option>`).join("");
  }
  sel.value = S.market;

  setHTML("alerts", d.alerts.map((a) => `<div class="alert ${a.level}">${esc(a.text)}</div>`).join(""));

  // KPI cards (account-wide)
  const startEq = isNum(L.startEquity) ? L.startEquity : e.equityStart;
  const runDelta = isNum(L.equity) && isNum(startEq) ? L.equity - startEq : null;
  const ddLim = isNum(lim.maxDrawdownUsd) ? lim.maxDrawdownUsd : null;
  const ddUsed = isNum(runDelta) && runDelta < 0 && ddLim ? Math.min(1, -runDelta / ddLim) : 0;
  const share = e.volumeUsd > 0 ? d.markets.reduce((a, m) => a + m.makerVolumeUsd, 0) / Math.max(1e-9, d.markets.reduce((a, m) => a + m.volumeUsd, 0)) : null;
  const k = [];
  k.push(card("Vốn (equity)", isNum(e.equityNow) ? fmt(e.equityNow) + " USD" : "–", "",
    `Δ ${rangeText()}: <span class="${cls(e.equityDelta)}">${sgn(e.equityDelta, 3)} USD</span><br>Δ từ đầu phiên: <span class="${cls(runDelta)}">${sgn(runDelta, 3)}</span> (đầu ${fmt(startEq)})` +
    (ddLim ? `<div class="bar"><i style="width:${(ddUsed * 100).toFixed(0)}%;background:var(--bad)"></i></div>ngưỡng dừng lỗ ${ddLim} USD` : "")));
  k.push(card("Khối lượng khớp", fmt(e.volumeUsd) + " USD", "",
    `${rangeText()} · maker ${share === null ? "–" : (share * 100).toFixed(1) + "%"} khối lượng<br>ngày UTC: ${fmt(L.dayVolumeUsd, 0)} USD`));
  const ratio = isNum(L.cycleMakerRatio) ? L.cycleMakerRatio : null, need = isNum(lim.minMakerRatio) ? lim.minMakerRatio : 0.8;
  k.push(`<div class="card"><h2>Rebate chu kỳ ${esc(L.cycle || "")}</h2>
    <div class="big ${ratio === null ? "" : ratio >= need ? "good" : "bad"}">${ratio === null ? "chưa có lệnh khớp" : (ratio * 100).toFixed(1) + "% maker"}</div>
    <div class="bar"><i style="width:${ratio === null ? 0 : (ratio * 100).toFixed(0)}%"></i><b style="left:${need * 100}%"></b></div>
    <div class="sub">cần ≥ ${(need * 100).toFixed(0)}% · ${L.rebateEligible === false ? '<span class="bad">KHÔNG đủ điều kiện</span>' : "đủ điều kiện"} · rebate dự kiến ${fmt(L.projectedRebateUsd, 4)} USD</div></div>`);
  k.push(card("Hiệu quả (EWMA)", sgn(L.pnlBps, 2) + " bps", cls(L.pnlBps), `spreadMult ${fmt(L.spreadMult, 2)} · PnL gộp ${rangeText()}: ${sgn(e.grossPnlBps, 2)} bps`));
  const allFills = d.markets.reduce((a, m) => a + m.fills, 0), mk = d.markets.reduce((a, m) => a + m.maker, 0), tk = d.markets.reduce((a, m) => a + m.taker, 0);
  k.push(card("Khớp lệnh", `${mk} maker / ${tk} taker`, tk ? "warn" : "", `${allFills} lệnh · ${rangeText()} · phí ${fmt(e.feesUsd, 4)} USD`));
  k.push(card("Gas (APT)", isNum(e.gasApt) ? fmt(e.gasApt, 5) : "–", "",
    `${rangeText()} · ${isNum(e.txCount) ? e.txCount : "–"} tx · ≈ ${fmt(e.gasUsd, 4)} USD<br>cả phiên ${fmt(e.gasAptRun, 5)} APT · ví ký ${fmt(e.aptBalance, 4)} APT` +
    `${isNum(e.aptRunwayHours) ? "<br>đủ ~" + fmt(e.aptRunwayHours, 0) + " giờ" : ""}`));
  k.push(card("An toàn", `ramp ${isNum(L.rampStage) ? L.rampStage : "–"} · ${isNum(L.sizeMult) ? "x" + L.sizeMult : ""}`, "",
    `cầu chì ngắt ${d.counters.fuseTrips} lần · tạm dừng ${d.counters.pauses} · cảnh báo ${d.counters.warn} · lỗi ${d.counters.error} (${rangeText()})`));
  setHTML("kpis", k.join(""));

  // Market cards
  const names = r.markets || [];
  setHTML("markets", d.markets.map((m) => {
    const col = `var(${MCOL[Math.max(0, names.indexOf(m.name)) % MCOL.length]})`;
    const pct = isNum(m.capUsd) && m.capUsd > 0 && isNum(m.positionUsd) ? Math.min(1, Math.abs(m.positionUsd) / m.capUsd) : null;
    const fz = m.fuse === "tripped" ? `<span class="warn">cầu chì ngắt${m.fuseUntil ? " · còn " + Math.max(0, Math.ceil((m.fuseUntil - d.generatedAt) / 1000)) + "s" : ""}</span>` : m.fuse === "recovering" ? "đang hồi phục (báo giá rộng hơn)" : "cầu chì bình thường";
    const st = m.paused ? `<span class="warn">tạm dừng: ${esc(m.paused)}</span>` : m.quoting ? "đang báo giá" : m.quoting === false ? "chưa báo giá" : "–";
    return `<div class="card mk"><h2><span style="color:${col}">● ${esc(m.name)}</span><span class="muted">${st}</span></h2>
      <div class="big">${fmt(m.mid, m.mid > 1000 ? 1 : 3)}</div>
      <div class="sub">mua ${fmt(m.bid, m.mid > 1000 ? 1 : 3)} · bán ${fmt(m.ask, m.mid > 1000 ? 1 : 3)} · chênh ${fmt(m.spreadBps, 2)} bps · ${fz}</div>
      <div class="kv" style="margin-top:8px">
        <span>Vị thế</span><span>${fmt(m.position, 5)} (${sgn(m.positionUsd)} USD)</span>
        <span>Giới hạn đang áp dụng</span><span>${fmt(m.capUsd, 1)} USD${pct === null ? "" : " · " + (pct * 100).toFixed(0) + "%"}</span>
        <span>Khối lượng · ${rangeText()}</span><span>${fmt(m.volumeUsd)} USD · ${m.fills} lệnh</span>
        <span>Maker / taker</span><span>${m.maker} / <span class="${m.taker ? "warn" : ""}">${m.taker}</span></span>
        <span>Phí trả</span><span>${fmt(m.feesUsd, 4)} USD</span>
      </div>${pct === null ? "" : `<div class="bar"><i style="width:${(pct * 100).toFixed(0)}%;background:${col}"></i></div>`}</div>`;
  }).join(""));

  // Economics
  const row = (a, b, c) => `<tr><td>${a}</td><td class="r">${b}</td><td class="r muted">${c || ""}</td></tr>`;
  setHTML("econ",
    row("Khối lượng khớp", fmt(e.volumeUsd) + " USD") +
    row("Phí đã trả", fmt(e.feesUsd, 4) + " USD", isNum(e.feeBps) ? fmt(e.feeBps, 2) + " bps" : "") +
    row("PnL giao dịch gộp (trước phí)", `<span class="${cls(e.grossPnlUsd)}">${sgn(e.grossPnlUsd, 4)} USD</span>`, isNum(e.grossPnlBps) ? sgn(e.grossPnlBps, 2) + " bps" : "") +
    row("Δ vốn (sau phí, gồm lãi/lỗ chưa chốt)", `<span class="${cls(e.equityDelta)}">${sgn(e.equityDelta, 4)} USD</span>`) +
    row("Rebate dự kiến (chưa nhận)", sgn(e.rebateUsd, 4) + " USD", fmt(e.rebateBps, 1) + " bps × khối lượng maker") +
    row("Gas", "−" + fmt(e.gasUsd, 4) + " USD", `${fmt(e.gasApt, 5)} APT × ${fmt(e.aptUsd, 4)} · ${isNum(e.gasBps) ? fmt(e.gasBps, 1) + " bps" : "–"}`) +
    `<tr><td><b>Ròng ước tính</b></td><td class="r"><b class="${cls(e.netUsd)}">${sgn(e.netUsd, 4)} USD</b></td><td></td></tr>`);
  const feeNet = isNum(e.feeBps) ? e.feeBps - e.rebateBps : null;
  setHTML("econNote", isNum(feeNet) && isNum(e.gasBps)
    ? `Hòa vốn cần PnL gộp ≥ phí ròng ${fmt(feeNet, 2)} bps + gas ${fmt(e.gasBps, 1)} bps = <b>${fmt(feeNet + e.gasBps, 1)} bps</b>; hiện ${sgn(e.grossPnlBps, 2)} bps. Rebate chỉ về sau chu kỳ nếu giữ ≥ ${(need * 100).toFixed(0)}% maker.`
    : "Cần có lệnh khớp trong khoảng này để tính hòa vốn. Phiên ngắn rất nhiễu.");

  // Quotes per market
  setHTML("quotes", d.markets.filter((m) => m.quotes).map((m) => {
    const q = m.quotes, dec = m.mid > 1000 ? 1 : 3;
    const asks = [...q.asks].reverse().map((x) => `<tr><td class="bad">bán</td><td class="r">${fmt(x[0], dec)}</td><td class="r">${fmt(x[1], 5)}</td><td class="r muted">${fmt(x[0] * x[1])} USD</td></tr>`).join("");
    const bids = q.bids.map((x) => `<tr><td class="good">mua</td><td class="r">${fmt(x[0], dec)}</td><td class="r">${fmt(x[1], 5)}</td><td class="r muted">${fmt(x[0] * x[1])} USD</td></tr>`).join("");
    const mid = q.bids[0] && q.asks[0] ? (q.bids[0][0] + q.asks[0][0]) / 2 : null;
    const spr = mid ? ((q.asks[0][0] - q.bids[0][0]) / mid) * 1e4 : null;
    const age = r.liveSeen ? "trực tiếp" : `lúc ${hhmmss(m.quotesAt)}`;
    return `<div class="sub"><b>${esc(m.name)}</b> · ${age} · khoảng cách bid/ask của bot ${fmt(spr, 2)} bps</div>
      <table><tr><th></th><th class="r">Giá</th><th class="r">Khối lượng</th><th class="r">Giá trị</th></tr>${asks}${bids}</table>`;
  }).join("") || '<div class="muted">Chưa có báo giá nào.</div>');

  // Tables, filtered by window and market on the server
  const win = rangeText() + (S.market ? ` · ${S.market}` : "");
  $("h-fills").textContent = `Lệnh khớp · ${d.fills.total} (${win})`;
  setHTML("fills", '<tr><th>Giờ</th><th>Thị trường</th><th>Phía</th><th class="r">Giá</th><th class="r">KL</th><th class="r">USD</th><th>Loại</th><th class="r">Phí</th></tr>' +
    (d.fills.recent.map((f) => `<tr><td>${tfmt(f.t, d.window.to - d.window.from)}</td><td>${esc(f.market)}</td><td class="${f.side === "buy" ? "good" : "bad"}">${f.side === "buy" ? "mua" : "bán"}</td><td class="r">${fmt(f.px)}</td><td class="r">${fmt(f.sz, 5)}</td><td class="r">${fmt(f.usd)}</td><td><span class="tag ${f.maker ? "t-maker" : "t-taker"}">${f.maker ? "maker" : "taker"}</span></td><td class="r">${fmt(f.fee, 4)}</td></tr>`).join("") ||
    '<tr><td colspan="8" class="muted">Không có lệnh khớp trong khoảng này.</td></tr>'));

  const net = r.network === "testnet" ? "testnet" : "mainnet";
  $("h-txs").textContent = `Giao dịch đặt lệnh · ${d.ladders.total} (${win})`;
  setHTML("txs", '<tr><th>Giờ</th><th>Thị trường</th><th>Chế độ</th><th class="r">Gas</th><th>Tx</th></tr>' +
    (d.ladders.recent.map((t) => `<tr><td>${tfmt(t.t, d.window.to - d.window.from)}</td><td>${esc(t.market)}</td><td>${t.dry ? "thử" : "thật" + (t.path ? " (" + esc(t.path) + ")" : "")}</td><td class="r">${isNum(t.gasUsed) ? t.gasUsed : "–"}</td><td class="mono">${t.hash ? `<a target="_blank" rel="noopener noreferrer" href="https://explorer.aptoslabs.com/txn/${encodeURIComponent(t.hash)}?network=${net}">${esc(t.hash.slice(0, 10))}…</a>` : "–"}</td></tr>`).join("") ||
    '<tr><td colspan="5" class="muted">Không có giao dịch trong khoảng này.</td></tr>') +
    `<tr><td colspan="5" class="sub">${d.ladders.placed} đã gửi · ${d.ladders.dry} thử · ${d.ladders.failed} lỗi${isNum(d.ladders.perHour) ? " · " + fmt(d.ladders.perHour, 1) + " lần/giờ" : ""}</td></tr>`);

  $("h-events").textContent = `Sự kiện · ${d.events.total} (${win})`;
  setHTML("events", '<tr><th>Giờ</th><th>Mức</th><th>Nội dung</th></tr>' +
    (d.events.rows.map((v) => `<tr><td>${tfmt(v.t, d.window.to - d.window.from)}</td><td><span class="tag t-${esc(v.level)}">${esc(v.level)}</span></td><td>${esc(v.msg)} <span class="detail mono">${esc(v.detail)}</span></td></tr>`).join("") ||
    '<tr><td colspan="3" class="muted">Không có sự kiện đáng chú ý trong khoảng này.</td></tr>'));

  const w = d.window;
  setHTML("foot", esc(`${d.logLines} dòng log trong bộ nhớ · khoảng ${tfmt(w.from, w.to - w.from)} → ${tfmt(w.to, w.to - w.from)} · làm mới mỗi giây · chỉ đọc, không điều khiển bot (dừng bot: Ctrl+C hoặc tạo file state/KILL)`));

  const span = Math.max(1, w.to - w.from);
  const eq = [{ xs: d.series.t, ys: d.series.equity, color: "--m0", label: "Vốn" }];
  drawChart("c-equity", eq, { base: isNum(e.equityStart) ? e.equityStart : null, dec: 3, span });
  const pos = names.filter((n) => d.series.positionUsdByMarket[n]).map((n, i) => ({ xs: d.series.t, ys: d.series.positionUsdByMarket[n], color: MCOL[names.indexOf(n) % MCOL.length], label: n }));
  drawChart("c-pos", pos, { base: 0, dec: 2, span });
  setHTML("l-pos", legend(pos));
  const vol = names.filter((n) => d.volumeByMarket[n]).map((n) => ({ xs: d.volumeByMarket[n].t, ys: d.volumeByMarket[n].cumUsd, color: MCOL[names.indexOf(n) % MCOL.length], label: n, step: true }));
  if (vol.length !== 1) vol.push({ xs: d.volumeSeries.t, ys: d.volumeSeries.cumUsd, color: "--ink-line", label: "Tổng", step: true });
  drawChart("c-vol", vol, { dec: 0, min0: true, span });
  setHTML("l-vol", legend(vol));
  const lm = isNum(lim.minGasBalanceApt) ? lim.minGasBalanceApt : null;
  drawChart("c-apt", [{ xs: d.series.t, ys: d.series.aptBalance, color: "--info", label: "APT" }], { base: lm, dec: 4, span });
}

function legend(series) {
  return series.map((s) => `<span><i style="background:${s.color === "--ink-line" ? "var(--muted)" : `var(${s.color})`}"></i>${esc(s.label)}</span>`).join("");
}

// ---- charts ----------------------------------------------------------------------------------
const hover = {};
const chartArgs = {};
function drawChart(id, series, o) {
  chartArgs[id] = [series, o];
  const cv = $(id), dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  const css = (n) => (n === "--ink-line" ? getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() : getComputedStyle(document.documentElement).getPropertyValue(n).trim());
  const ink = css("--muted"), line = css("--line");
  g.font = "11px system-ui, sans-serif";
  const lines = series.map((s) => ({ ...s, pts: s.xs.map((x, i) => [x, s.ys[i]]).filter((p) => isNum(p[1])) })).filter((s) => s.pts.length);
  if (!lines.length || lines.every((s) => s.pts.length < 2)) { g.fillStyle = ink; g.fillText("chưa đủ dữ liệu trong khoảng này", 10, 20); return; }
  const all = lines.flatMap((s) => s.pts.map((p) => p[1]));
  let lo = Math.min(...all), hi = Math.max(...all);
  if (isNum(o.base)) { lo = Math.min(lo, o.base); hi = Math.max(hi, o.base); }
  if (o.min0) lo = Math.min(lo, 0);
  if (hi - lo < 1e-9) { hi += 0.5; lo -= 0.5; }
  const padv = (hi - lo) * 0.08; lo = o.min0 ? 0 : lo - padv; hi += padv;
  const x0 = 58, x1 = W - 10, y0 = 8, y1 = H - 20;
  const t0 = Math.min(...lines.map((s) => s.pts[0][0])), t1 = Math.max(...lines.map((s) => s.pts[s.pts.length - 1][0]));
  const X = (t) => x0 + ((t - t0) / Math.max(1, t1 - t0)) * (x1 - x0);
  const Y = (v) => y1 - ((v - lo) / (hi - lo)) * (y1 - y0);
  g.strokeStyle = line; g.fillStyle = ink; g.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const v = lo + ((hi - lo) * i) / 3, y = Y(v);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.fillText(fmt(v, o.dec), 4, y + 4);
  }
  g.fillText(tfmt(t0, o.span), x0, H - 5);
  const lab = tfmt(t1, o.span); g.fillText(lab, x1 - g.measureText(lab).width, H - 5);
  if (isNum(o.base)) {
    g.setLineDash([4, 4]); g.strokeStyle = ink;
    g.beginPath(); g.moveTo(x0, Y(o.base)); g.lineTo(x1, Y(o.base)); g.stroke(); g.setLineDash([]);
  }
  for (const s of lines) {
    g.strokeStyle = css(s.color); g.lineWidth = 2; g.beginPath();
    s.pts.forEach((p, i) => {
      if (i === 0) g.moveTo(X(p[0]), Y(p[1]));
      else { if (s.step) g.lineTo(X(p[0]), Y(s.pts[i - 1][1])); g.lineTo(X(p[0]), Y(p[1])); }
    });
    g.stroke();
    const lp = s.pts[s.pts.length - 1];
    g.fillStyle = css(s.color); g.beginPath(); g.arc(X(lp[0]), Y(lp[1]), 3, 0, 7); g.fill();
  }
  const hx = hover[id];
  if (isNum(hx) && hx >= x0 && hx <= x1) {
    const tt = t0 + ((hx - x0) / (x1 - x0)) * (t1 - t0);
    g.strokeStyle = ink; g.lineWidth = 1; g.beginPath(); g.moveTo(hx, y0); g.lineTo(hx, y1); g.stroke();
    const rows = lines.map((s) => {
      let best = s.pts[0];
      for (const p of s.pts) if (Math.abs(p[0] - tt) < Math.abs(best[0] - tt)) best = p;
      return `${s.label}: ${fmt(best[1], o.dec)}`;
    });
    const text = [tfmt(tt, 0), ...rows];
    const w = Math.max(...text.map((t) => g.measureText(t).width)) + 12, h = text.length * 14 + 6;
    const bx = hx + 10 + w > W ? hx - w - 10 : hx + 10;
    g.fillStyle = css("--card"); g.strokeStyle = line; g.fillRect(bx, y0 + 4, w, h); g.strokeRect(bx, y0 + 4, w, h);
    g.fillStyle = css("--ink") || ink;
    text.forEach((t, i) => g.fillText(t, bx + 6, y0 + 17 + i * 14));
  }
}
for (const id of ["c-equity", "c-pos", "c-vol", "c-apt"]) {
  const cv = $(id);
  cv.addEventListener("mousemove", (ev) => { hover[id] = ev.offsetX; if (chartArgs[id]) drawChart(id, ...chartArgs[id]); });
  cv.addEventListener("mouseleave", () => { hover[id] = null; if (chartArgs[id]) drawChart(id, ...chartArgs[id]); });
}

// ---- polling (every second) ------------------------------------------------------------------
let busy = false;
async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const q = new URLSearchParams();
    const rs = rangeSec();
    if (rs) q.set("range", String(rs));
    if (S.market) q.set("market", S.market);
    if (!S.aptAuto) q.set("apt", String(S.apt));
    const res = await fetch("/api/data?" + q, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
  } catch (err) {
    setHTML("alerts", `<div class="alert error">Không lấy được dữ liệu từ dashboard server: ${esc(err.message || err)}. Kiểm tra tiến trình dashboard và đường hầm SSH.</div>`);
  } finally {
    busy = false;
  }
}
syncControls();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
window.addEventListener("resize", () => { if (lastData) render(lastData); });
</script>
</body>
</html>
